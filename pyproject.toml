[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakfix"
version = "0.1.0"
description = "Phase 1 prototype for change-aware assumption falsification"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
breakfix = "breakfix.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
